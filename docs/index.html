<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck Forge — Commander deck helper</title>
<style>
  :root {
    --bg: #14161f; --panel: #1d2030; --panel2: #232741; --text: #e8e9f0;
    --dim: #9aa0b8; --accent: #7aa2ff; --good: #6fd08c; --warn: #ffb454;
    --bad: #ff6b6b; --border: #32365227;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, Segoe UI, sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 18px 24px 6px; }
  h1 { margin: 0; font-size: 22px; }
  h1 small { color: var(--dim); font-weight: normal; font-size: 13px; margin-left: 10px; }
  main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr;
         gap: 16px; padding: 16px 24px 40px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid #323652;
           border-radius: 10px; padding: 14px 16px; }
  textarea { width: 100%; height: 340px; background: var(--panel2); color: var(--text);
             border: 1px solid #3a3f63; border-radius: 8px; padding: 10px;
             font: 13px/1.45 ui-monospace, Consolas, monospace; resize: vertical; }
  input[type=text], input[type=number] {
    background: var(--panel2); color: var(--text); border: 1px solid #3a3f63;
    border-radius: 6px; padding: 6px 8px; width: 100%; font-size: 14px; }
  label { display: block; margin: 10px 0 3px; color: var(--dim); font-size: 13px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button { margin-top: 14px; width: 100%; padding: 10px; font-size: 16px;
           background: var(--accent); color: #10131f; font-weight: 600;
           border: 0; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 8px; }
  #status { margin-top: 10px; font-size: 13px; color: var(--warn); min-height: 1.2em; }
  section { margin-bottom: 22px; }
  section h2 { font-size: 17px; margin: 0 0 8px; border-bottom: 1px solid #323652;
               padding-bottom: 6px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
               gap: 8px; }
  .stat { background: var(--panel2); border-radius: 8px; padding: 8px 12px; }
  .stat b { font-size: 18px; }
  .stat .target { color: var(--dim); font-size: 12px; }
  .breakdown { margin-top: 10px; }
  .breakdown summary { color: var(--text); }
  .card-list { color: var(--dim); font-size: 12px; margin: 5px 0 10px;
               line-height: 1.6; }
  .card-list a { color: var(--accent); text-decoration: none; }
  .card-list a:hover { text-decoration: underline; }
  .ok { color: var(--good); } .low { color: var(--bad); } .high { color: var(--warn); }
  .combo { background: var(--panel2); border-radius: 8px; padding: 8px 12px;
           margin: 6px 0; font-size: 14px; }
  .combo a { color: var(--accent); text-decoration: none; }
  .combo .produces { color: var(--dim); font-size: 13px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px;
         margin-left: 6px; vertical-align: 1px; }
  .tag.finite { background: #234631; color: var(--good); }
  .tag.infinite { background: #4a2330; color: var(--bad); }
  .tag.ends { background: #233a56; color: var(--accent); }
  .tag.banned { background: #4a2330; color: var(--bad); margin-left: 4px; }
  .addcard { font-weight: 600; margin: 12px 0 2px; }
  .addcard .price { color: var(--dim); font-weight: normal; font-size: 13px; }
  details { margin: 6px 0; }
  summary { cursor: pointer; color: var(--dim); }
  .finisher { display: flex; gap: 10px; background: var(--panel2); border-radius: 8px;
              padding: 8px 12px; margin: 6px 0; }
  .finisher .name { font-weight: 600; white-space: nowrap; }
  .finisher .name a { color: var(--text); text-decoration: none; }
  .finisher .name a:hover { color: var(--accent); }
  .finisher .text { color: var(--dim); font-size: 13px; }
  .pill-row { margin: 4px 0 10px; }
  .pill { display: inline-block; background: var(--panel2); border-radius: 12px;
          padding: 2px 10px; margin: 2px 4px 2px 0; font-size: 12px; color: var(--dim); }
  .err { color: var(--bad); }
  .checkline { margin-top: 8px; font-size: 13px; color: var(--dim); }
  .checkline input { vertical-align: -2px; }
</style>
</head>
<body>
<header>
  <h1>Deck Forge <small>paste a pile of cards → see how to make it win</small></h1>
</header>
<main>
  <div class="panel">
    <label>Card list — any size, one per line (<code>1x Sol Ring</code> or just <code>Sol Ring</code>)</label>
    <textarea id="decklist" placeholder="1x Gray Merchant of Asphodel
1x Zulaport Cutthroat
Blood Artist
..."></textarea>
    <label>Commander (optional — leave blank for a theme pile; colors are inferred)</label>
    <input type="text" id="commander" placeholder="The Ever-Changing 'Dane">
    <label>What should the deck do? (optional — forces themes even if the pile doesn't show them yet)</label>
    <input type="text" id="goal" placeholder="steal creatures, sacrifice them, become them">
    <details style="margin-top:10px">
      <summary class="hint" style="cursor:pointer">Or pick themes to build toward…</summary>
      <div id="themeChecks" class="checkline"></div>
    </details>
    <div class="row">
      <div><label>Max card price ($)</label><input type="number" id="maxprice" value="100"></div>
      <div><label>&nbsp;</label>
        <div class="checkline"><input type="checkbox" id="showinf"> show infinite combos</div>
      </div>
    </div>
    <button id="go">Analyze</button>
    <div id="status"></div>
    <div class="hint">Data: Scryfall (live) + a bundled snapshot of
      <a href="https://commanderspellbook.com" target="_blank" style="color:var(--accent)">Commander Spellbook</a>'s combo database.
      Nothing you paste is uploaded anywhere. Infinite combos are hidden by default on purpose.</div>
  </div>
  <div id="results" class="panel" style="display:none">
    <section id="health"></section>
    <section id="themes"></section>
    <section id="synergy"></section>
    <section id="combos"></section>
    <section id="almost"></section>
    <section id="finishers"></section>
  </div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const front = n => n.split("//")[0].trim();

const GAME_ENDING = /wins? the game|loses? the game|damage|life loss|mill|poison|infect|combat/i;
const FINISHER_BUCKETS = {
  "Alternate win condition": '(o:"you win the game") -o:"can\'t win"',
  "Drain the table": 'o:/each opponent loses [X\\d]+ life/',
  "Burn the table": 'o:/deals [X\\d]+ damage to each opponent/',
  "Overrun / go wide": '(t:sorcery or t:instant) o:/creatures you control get \\+[X\\d]/',
  "Extra combat": 'o:"additional combat phase"',
  "Mass evasion": '(t:sorcery or t:instant or t:enchantment) (o:"can\'t be blocked" or o:"gain flying until") o:"creatures you control"',
};
// Commander deck baseline (per ~99 cards) — scaled down for theme piles.
const BASELINE = { Lands: 37, Ramp: 10, "Card draw": 10, Interaction: 10, "Board wipes": 3 };

// Accepts plain lists plus Archidekt ("1x Name (set) 123 *F* [Category]"),
// Moxfield/MTGA ("1 Name (SET) 123"), and section-header exports. Cards in a
// Commander section/category come back separately; Sideboard/Maybeboard/
// Considering sections are ignored.
function parseList(text) {
  const cards = [], commanders = [];
  let section = "deck";
  for (let raw of text.split("\n")) {
    let line = raw.trim();
    if (!line || line.startsWith("//")) continue;
    const header = line.match(/^\[?(commander|deck|mainboard|main|sideboard|maybeboard|considering|tokens?)s?:?\]?$/i);
    if (header) { section = header[1].toLowerCase(); continue; }
    if (/^(sideboard|maybeboard|considering|token)/.test(section)) continue;

    const m = line.match(/^(\d+)x?\s+(.+)$/);
    let qty = 1, name = line;
    if (m) { qty = +m[1]; name = m[2]; }

    // Archidekt category tag — may mark the commander or a skipped board.
    let isCmdr = section === "commander" || /\*CMDR\*/i.test(name);
    const cat = name.match(/\[([^\]]*)\]\s*$/);
    if (cat) {
      if (/maybeboard|sideboard|considering/i.test(cat[1])) continue;
      if (/commander/i.test(cat[1])) isCmdr = true;
      name = name.slice(0, cat.index);
    }
    name = name
      .replace(/\*CMDR\*/i, "")
      .replace(/\*[A-Z]+\*/g, "")            // foil/etch flags like *F*
      .replace(/\^[^^]*\^/g, "")             // Archidekt ^modifier^ tags
      .replace(/\s*\(([A-Za-z0-9]{2,6})\)(\s+[\w★-]+)?\s*$/, "") // (set) 123
      .trim();
    if (!name) continue;
    (isCmdr ? commanders : cards).push({ name, qty });
  }
  return { cards, commanders: commanders.map(c => c.name) };
}

async function scryfallCollection(names, status) {
  const found = new Map(), missing = [], corrections = [];
  for (let i = 0; i < names.length; i += 75) {
    status(`Looking up cards on Scryfall (${i + 1}–${Math.min(i + 75, names.length)} of ${names.length})…`);
    const r = await fetch("https://api.scryfall.com/cards/collection", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ identifiers: names.slice(i, i + 75).map(n => ({ name: front(n) })) }),
    });
    if (!r.ok) throw new Error("Scryfall lookup failed: " + r.status);
    const d = await r.json();
    for (const c of d.data) found.set(front(c.name).toLowerCase(), c);
    for (const nf of d.not_found || []) missing.push(nf.name);
    await sleep(120);
  }
  // Second chance for typos: Scryfall's fuzzy endpoint. Keyed under the name
  // as pasted, so the rest of the run just works; correction is reported.
  const stillMissing = [];
  for (const n of missing.slice(0, 15)) {
    status(`"${n}" not found — trying fuzzy match…`);
    try {
      const r = await fetch("https://api.scryfall.com/cards/named?fuzzy="
                            + encodeURIComponent(front(n)));
      if (r.ok) {
        const c = await r.json();
        found.set(front(n).toLowerCase(), c);
        found.set(front(c.name).toLowerCase(), c);
        corrections.push({ from: n, to: c.name });
      } else {
        stillMissing.push(n);
      }
    } catch (e) {
      stillMissing.push(n);
    }
    await sleep(120);
  }
  stillMissing.push(...missing.slice(15));
  return { found, missing: stillMissing, corrections };
}

function oracleOf(c) {
  if (c.oracle_text) return c.oracle_text;
  return (c.card_faces || []).map(f => f.oracle_text || "").join("\n");
}

function categorize(card) {
  const t = card.type_line || "", o = oracleOf(card), ol = o.toLowerCase();
  if (/\bLand\b/.test(t)) return ["Lands"];
  const roles = [];
  if (/add \{|add (one|two|three|x) mana|create (a|one|two|three|x) treasure tokens?|search your library for .{0,30}(land|plains|island|swamp|mountain|forest) card,? put it onto the battlefield|spells? you cast cost .{0,12} less to cast/i.test(o)
      && !/\bCreature\b.*\bAura\b/.test(t)) roles.push("Ramp");
  if (/draw (a|one|two|three|four|five|six|seven|x|\d+|that many) cards?\b|draw cards? equal to/.test(ol))
    roles.push("Card draw");
  if (/destroy all|exile all|each creature|all creatures/.test(ol)
      && /destroy|exile|-\d+\/-\d+|sacrifices/.test(ol)) roles.push("Board wipes");
  if (/(destroy|exile|counter|return) target|target .{0,35} (gets? -\d+\/-\d+|phases out)|deals? (\d+|x) damage to (any target|target creature)|put target .{0,35} (on the top|on the bottom|into its owner's library)|each opponent sacrifices/.test(ol))
    roles.push("Interaction");
  return roles.length ? roles : ["Other"];
}

// Combo matching runs client-side against a snapshot of Commander
// Spellbook's DB (combos.json, built by scripts/build_combo_db.py) — their
// API only allows CORS from localhost/their own frontends, and this way the
// combos feature also works offline once the page is cached.
let COMBO_DB = null;
async function loadComboDb(status) {
  if (COMBO_DB) return COMBO_DB;
  status("Loading combo database (one-time download)…");
  const r = await fetch("combos.json");
  if (!r.ok) throw new Error("couldn't load combos.json: " + r.status);
  COMBO_DB = await r.json();
  return COMBO_DB;
}

function matchCombos(db, deckSet, commanderName, ident) {
  const cmdr = commanderName ? front(commanderName).toLowerCase() : null;
  const included = [], almost = [];
  for (const e of db.combos) {
    // With a declared commander, suggestions must fit its color identity.
    if (cmdr && e.d && [...e.d].some(c => !ident.includes(c))) continue;
    const missing = [];
    let cmdrOk = true;
    for (let i = 0; i < e.c.length; i++) {
      const key = front(e.c[i]).toLowerCase();
      // A card flagged must-be-commander only counts if it IS the declared
      // commander; with no commander declared (open theme pile), anything goes.
      if ((e.m || []).includes(i) && cmdr && key !== cmdr) { cmdrOk = false; break; }
      if (!deckSet.has(key)) {
        missing.push(e.c[i]);
        if (missing.length > 1) break;
      }
    }
    if (!cmdrOk || missing.length > 1) continue;
    const produces = e.p;
    const info = {
      id: e.i, uses: e.c, produces, missing,
      infinite: produces.some(p => /^(near-)?infinite/i.test(p)),
      ends: produces.some(p => GAME_ENDING.test(p)),
      price: e.$ != null ? e.$ : null,
      popularity: e.o || 0,
      url: `https://commanderspellbook.com/combo/${e.i}/`,
    };
    (missing.length ? almost : included).push(info);
  }
  return { included, almost };
}

function comboHtml(c) {
  return `<div class="combo">
    <a href="${c.url}" target="_blank">${esc(c.uses.join(" + "))}</a>
    <span class="tag ${c.infinite ? "infinite" : "finite"}">${c.infinite ? "infinite" : "finite"}</span>
    ${c.ends ? '<span class="tag ends">ends the game</span>' : ""}
    <div class="produces">→ ${esc(c.produces.join("; "))}</div></div>`;
}

// ------------------------------------------------------------- themes
let THEMES = null;
async function loadThemes() {
  if (THEMES) return THEMES;
  const r = await fetch("themes.json");
  if (!r.ok) throw new Error("couldn't load themes.json: " + r.status);
  THEMES = await r.json();
  return THEMES;
}

let THEME_TAGS = null;
async function loadThemeTags() {
  if (THEME_TAGS) return THEME_TAGS;
  try {
    const r = await fetch("theme-tags.json");
    THEME_TAGS = r.ok ? (await r.json()).cards : {};
  } catch (_) { THEME_TAGS = {}; }
  return THEME_TAGS;
}

function typeParts(card) {
  const tl = (card.type_line || "").split("//")[0];
  const [types, subs] = tl.split("—").map(s => (s || "").trim());
  return { types: types ? types.split(/\s+/) : [],
           subtypes: subs ? subs.split(/\s+/) : [] };
}

function detectThemesJs(cardObjs, tax, cmdrCard, goalText, forced, tagIndex = {}) {
  // Themes the user typed as a goal or ticked are forced in; themes the
  // commander's own text matches get a lower support bar.
  const goal = (goalText || "").toLowerCase();
  const goalThemes = new Set(forced || []);
  for (const [theme, words] of Object.entries(tax.goals || {})) {
    if (goal && words.some(w => goal.includes(w))) goalThemes.add(theme);
  }
  const hits = {};
  for (const [theme, spec] of Object.entries(tax.themes)) {
    const weighted = !!(spec.strong || spec.weak);
    const strongPat = new RegExp((spec.strong || ["(?!x)x"]).join("|"), "i");
    const weakPat = new RegExp((spec.weak || ["(?!x)x"]).join("|"), "i");
    const pat = weighted ? null : new RegExp(spec.detect.join("|"), "i");
    let strongN = 0, weakN = 0;
    const matched = cardObjs.filter(c => {
      const text = oracleOf(c);
      const taggedCard = (tagIndex[front(c.name).toLowerCase()] || []).includes(theme);
      const strong = weighted && strongPat.test(text);
      const weak = weighted && !strong && weakPat.test(text);
      const legacy = !weighted && pat.test(text);
      if (!(taggedCard || strong || weak || legacy)) return false;
      if (taggedCard || strong) strongN++; else weakN++;
      return true;
    }).map(c => c.name);
    const commanderTags = cmdrCard ? (tagIndex[front(cmdrCard.name).toLowerCase()] || []) : [];
    const tagged = commanderTags.includes(theme);
    const commanderText = cmdrCard ? oracleOf(cmdrCard) : "";
    const cmdrHit = !!(cmdrCard && (weighted
      ? strongPat.test(commanderText)
      : pat.test(commanderText)));
    const isGoal = goalThemes.has(theme);
    const w = tax.weights || { strong: 2, weak: 1, commander_bonus: 3 };
    const score = strongN * w.strong + weakN * w.weak + (cmdrHit ? w.commander_bonus : 0);
    const qualifies = weighted
      ? (cmdrHit && matched.length || (strongN >= (tax.min_strong || 2) && score >= tax.min_cards))
      : (matched.length >= ((isGoal || tagged) ? 0 : (cmdrHit ? 1 : tax.min_cards)));
    if (qualifies && (matched.length || isGoal || tagged)) {
      hits[theme] = { matched, cmdrHit, isGoal, score };
    } else if (isGoal) {
      hits[theme] = { matched: [], cmdrHit, isGoal, score: 0 };
    }
  }
  const ranked = Object.entries(hits)
    .sort((a, b) => (b[1].isGoal - a[1].isGoal) || (b[1].cmdrHit - a[1].cmdrHit)
                    || (b[1].score - a[1].score)
                    || (b[1].matched.length - a[1].matched.length))
    .slice(0, tax.max_themes)
    .map(([theme, h]) => [theme, h.matched, h.cmdrHit, h.isGoal]);
  // Tribal: most common creature subtype, with a higher bar for types that
  // appear everywhere (Humans, Wizards...).
  const bySub = {};
  let nCreatures = 0;
  for (const c of cardObjs) {
    const { types, subtypes } = typeParts(c);
    if (!types.includes("Creature")) continue;
    nCreatures++;
    for (const s of subtypes) (bySub[s] = bySub[s] || []).push(c.name);
  }
  let tribal = null;
  const ubiq = tax.tribal.ubiquitous_types || {};
  for (const [type, members] of Object.entries(bySub).sort((a, b) => b[1].length - a[1].length)) {
    const need = ubiq[type] || tax.tribal.min_share;
    if (members.length >= tax.tribal.min_count && members.length >= need * Math.max(nCreatures, 1)) {
      tribal = [type, members];
      break;
    }
  }
  return { ranked, tribal };
}

function impactForCard(card, tax) {
  const text = oracleOf(card);
  const scope = (tax.impact?.scope || []).find(rule => new RegExp(rule.pattern, "i").test(text));
  if (!scope) return { score: 0, scope: null, delivery: null };
  const delivery = (tax.impact?.delivery || []).find(rule => new RegExp(rule.pattern, "i").test(text))
    || { name: "one-shot effect", weight: 1 };
  return { score: scope.weight * delivery.weight, scope: scope.name, delivery: delivery.name };
}

function themeEvidenceForCard(card, theme, tax, tagIndex) {
  const spec = tax.themes[theme], text = oracleOf(card);
  if ((tagIndex[front(card.name).toLowerCase()] || []).includes(theme)) return "strong";
  if (spec.strong || spec.weak) {
    if (new RegExp((spec.strong || []).join("|") || "(?!x)x", "i").test(text)) return "strong";
    if (new RegExp((spec.weak || []).join("|") || "(?!x)x", "i").test(text)) return "weak";
    return null;
  }
  return new RegExp(spec.detect.join("|"), "i").test(text) ? "strong" : null;
}

function tokenLinkedDraw(card) {
  return categorize(card).includes("Card draw")
    && /token|creatures?.{0,35}enter/i.test(oracleOf(card));
}

function createsCreatureTokens(card) {
  return /create .{0,40}creature tokens?/i.test(oracleOf(card));
}

function efficientRoleCard(card) {
  return card.cmc != null && card.cmc <= 2 && categorize(card).includes("Ramp");
}

function graveyardRecovery(card) {
  return /from (your|a) graveyard.{0,100}(battlefield|cast)|play lands? from your graveyard/i.test(oracleOf(card));
}

function highCommitmentGraveyardPayoff(card, cards, policy) {
  const settings = policy.high_commitment_graveyard_review || {
    minimum_mana_value: 6, minimum_colored_pips: 6,
    minimum_distinct_colors: 3, minimum_recovery_overlap: 2, review_risk: 4,
  };
  const { types } = typeParts(card);
  const pips = [...(card.mana_cost || "").matchAll(/\{([WUBRG])\}/g)].map(match => match[1]);
  const overlap = cards.filter(other => other !== card && graveyardRecovery(other)).length;
  const eligible = types.includes("Sorcery")
    && /return any number of .{0,80}from your graveyard/i.test(oracleOf(card))
    && card.cmc >= settings.minimum_mana_value
    && pips.length >= settings.minimum_colored_pips
    && new Set(pips).size >= settings.minimum_distinct_colors
    && overlap >= settings.minimum_recovery_overlap;
  return { eligible, overlap };
}

function cutCandidatesWeb(cards, suggestions, active, tribal, commander, counts, scale, tax, tagIndex) {
  if ((!active || !active.size) && !tribal) return [];
  const policy = tax.cut_candidates || {
    max_results: 5,
    keep_weights: { active_theme_weak: 1 },
    minimum_replacement_delta: 2,
    weak_theme_minimum_replacement_delta: 4,
    meaningful_multiplayer_impact: 3,
    high_commitment_graveyard_review: {
      minimum_mana_value: 6, minimum_colored_pips: 6,
      minimum_distinct_colors: 3, minimum_recovery_overlap: 2, review_risk: 4,
    },
  }, targets = BASELINE;
  const commanderKey = commander && front(commander.name).toLowerCase();
  const blinkCommander = active.has("Blink / ETB value") && commander
    && themeEvidenceForCard(commander, "Blink / ETB value", tax, tagIndex) === "strong"
    && /nonland permanent/i.test(oracleOf(commander));
  const tokenProduction = cards.some(createsCreatureTokens);
  return cards.map((card, order) => {
    if (commanderKey && front(card.name).toLowerCase() === commanderKey) return null;
    const roles = categorize(card);
    if (roles.includes("Lands")) return null;
    if (roles.filter(role => targets[role]).length >= 2) return null;
    if (efficientRoleCard(card)) return null;
    if (tokenProduction && tokenLinkedDraw(card)) return null;
    const { types, subtypes } = typeParts(card);
    if (blinkCommander && roles.includes("Ramp") && types.includes("Artifact")) return null;
    if (roles.some(role => targets[role] && counts[role] < Math.round(targets[role] * scale))) return null;
    let evidence = [...active].map(theme => themeEvidenceForCard(card, theme, tax, tagIndex));
    if (blinkCommander && evidence.includes("weak")) {
      evidence = evidence.map(value => value === "weak" ? "strong" : value);
    }
    const highCommitment = highCommitmentGraveyardPayoff(card, cards, policy);
    if (evidence.includes("strong") && !highCommitment.eligible) return null;
    if (tribal && subtypes.includes(tribal[0])) return null;
    const impact = impactForCard(card, tax);
    if (impact.score >= policy.meaningful_multiplayer_impact) return null;
    const weak = evidence.filter(x => x === "weak").length;
    if (weak) return null;
    let keep = weak * policy.keep_weights.active_theme_weak + impact.score;
    const reasons = [highCommitment.eligible ? "strong active-theme evidence"
      : weak ? "weak active-theme evidence only" : "no active-theme evidence"];
    if (highCommitment.eligible) {
      keep -= (policy.high_commitment_graveyard_review || { review_risk: 4 }).review_risk;
      reasons.push("high mana and color commitment", `one-shot graveyard recovery overlaps ${highCommitment.overlap} other recovery cards`);
    }
    reasons.push(roles.length === 1 && roles[0] === "Other" ? "Other functional role" : `${roles.join(", ")} is above target`);
    if (!impact.score) reasons.push("no multiplayer impact");
    return { card, reasons, keep, order };
  }).filter(Boolean).sort((a, b) => a.keep - b.keep || a.order - b.order)
    .slice(0, policy.max_results);
}

async function themeSuggestions(queries, ident, maxPrice, deckSet, tax, limit = 8) {
  const candidates = new Map();
  for (const q of queries) {
    const cards = await scryfallSearch(`(${q}) id<=${ident} legal:commander usd<=${maxPrice}`);
    for (const c of cards) {
      const key = front(c.name).toLowerCase();
      if (deckSet.has(key)) continue;
      const prior = candidates.get(key);
      candidates.set(key, prior ? { ...prior, matches: prior.matches + 1 }
                                : { card: c, matches: 1, order: candidates.size });
    }
    await sleep(120);
  }
  return [...candidates.values()]
    .sort((a, b) => b.matches - a.matches
      || impactForCard(b.card, tax).score - impactForCard(a.card, tax).score
      || a.order - b.order)
    .slice(0, limit)
    .map(c => ({ ...c.card, _themeMatches: c.matches }));
}

function finisherCardHtml(c) {
  const text = oracleOf(c).split("\n").find(l => GAME_ENDING.test(l))
               || oracleOf(c).split("\n")[0] || "";
  const price = c.prices && c.prices.usd ? ` · $${c.prices.usd}` : "";
  const impact = impactForCard(c, THEMES);
  const impactText = impact.score
    ? `<br>Multiplayer impact: ${esc(impact.scope)}; ${esc(impact.delivery)}` : "";
  return `<div class="finisher"><div class="name"><a href="${c.scryfall_uri}" target="_blank">${esc(c.name)}</a><br>
          <span class="text">${esc(c.mana_cost || "")}${price}</span></div>
          <div class="text">${esc(text.slice(0, 220))}${impactText}</div></div>`;
}

// ------------------------------------------------------------- EDHREC
function edhrecSlug(name) {
  return front(name).toLowerCase()
    .replace(/["'’.,]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

async function edhrecSynergy(commanderName, deckSet) {
  try {
    const r = await fetch(`https://json.edhrec.com/pages/commanders/${edhrecSlug(commanderName)}.json`);
    if (!r.ok) return null;
    const j = await r.json();
    const lists = (((j.container || {}).json_dict || {}).cardlists) || [];
    const pick = re => lists.find(l => re.test(l.header || ""));
    const high = pick(/high synergy/i), top = pick(/^top cards/i);
    if (!high && !top) return null;
    const views = [...((high || {}).cardviews || []), ...((top || {}).cardviews || [])];
    const seen = new Set(), fresh = [];
    let owned = 0;
    for (const cv of views) {
      const key = front(cv.name).toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);
      if (deckSet.has(key)) owned++;
      else fresh.push(cv);
    }
    return { fresh: fresh.slice(0, 12), owned, total: seen.size };
  } catch (e) {
    return null; // EDHREC is a bonus signal; never fail the run over it
  }
}

async function scryfallSearch(q, status) {
  try {
    const r = await fetch("https://api.scryfall.com/cards/search?order=edhrec&unique=cards&q="
                          + encodeURIComponent(q), { signal: AbortSignal.timeout(12000) });
    if (r.status === 404 || r.status === 429) return [];
    if (!r.ok) throw new Error("Scryfall search failed: " + r.status);
    return (await r.json()).data;
  } catch (e) {
    if (e.name === "TimeoutError" || e.name === "AbortError") return [];
    throw e;
  }
}

async function analyze() {
  const btn = $("go"), statusEl = $("status");
  const status = m => statusEl.textContent = m;
  btn.disabled = true;
  try {
    const parsed = parseList($("decklist").value);
    const entries = parsed.cards;
    if (!entries.length && !parsed.commanders.length) {
      status(/archidekt\.com|moxfield\.com/i.test($("decklist").value)
        ? "Deck sites block browser access — on Archidekt use Export → Text and paste that here (the [Commander] tag is picked up automatically)."
        : "Paste some cards first.");
      btn.disabled = false; return;
    }
    // A commander found in the pasted list (e.g. Archidekt's [Commander] tag)
    // fills the field so the user can see and override it.
    if (!$("commander").value.trim() && parsed.commanders.length) {
      $("commander").value = parsed.commanders[0];
    }
    const commander = $("commander").value.trim();
    const maxPrice = +$("maxprice").value || 100;
    const showInf = $("showinf").checked;

    const allNames = entries.map(e => e.name);
    if (commander) allNames.push(commander);
    const { found, missing, corrections } =
      await scryfallCollection([...new Set(allNames)], status);

    // Identity, counts, health
    const deckSet = new Set([...found.keys()]);
    for (const e of entries) deckSet.add(front(e.name).toLowerCase());
    const cardLink = (name, label = name) => {
      const card = found.get(front(name).toLowerCase());
      const linked = card && card.scryfall_uri
        ? `<a href="${esc(card.scryfall_uri)}" target="_blank" rel="noopener">${esc(label)}</a>`
        : esc(label);
      return linked + (card && card.legalities && card.legalities.commander === "banned"
        ? '<span class="tag banned">banned</span>' : "");
    };
    const identSet = new Set();
    const counts = { Lands: 0, Ramp: 0, "Card draw": 0, Interaction: 0, "Board wipes": 0, Other: 0 };
    const classified = Object.fromEntries(Object.keys(counts).map(k => [k, []]));
    let total = 0;
    for (const e of entries) {
      const c = found.get(front(e.name).toLowerCase());
      total += e.qty;
      if (!c) continue;
      (c.color_identity || []).forEach(x => identSet.add(x));
      for (const category of categorize(c)) {
        counts[category] += e.qty;
        classified[category].push({ name: c.name, qty: e.qty });
      }
    }
    let cmdrCard = null;
    if (commander) {
      cmdrCard = found.get(front(commander).toLowerCase());
      if (cmdrCard) (cmdrCard.color_identity || []).forEach(x => identSet.add(x));
    }
    const ident = "WUBRG".split("").filter(x => identSet.has(x)).join("") || "C";
    const scale = Math.min(1, total / 99);

    let h = `<h2>Deck health — ${total} cards, identity ${ident}${cmdrCard ? ", commander " + esc(cmdrCard.name) : ""}</h2>`;
    if (corrections.length) h += `<div class="hint">Auto-corrected: ${corrections.map(c => esc(c.from) + " → " + esc(c.to)).join("; ")}</div>`;
    if (missing.length) h += `<div class="err">Not found on Scryfall even with fuzzy matching: ${esc(missing.join(", "))}</div>`;
    const banned = [...new Map([...found.values()]
      .filter(c => c.legalities && c.legalities.commander === "banned")
      .map(c => [c.name, c])).values()];
    if (banned.length) {
      h += `<div class="err"><b>Commander banned list:</b> ${banned.map(c => cardLink(c.name)).join(" · ")}. Analysis continues so you can still evaluate the deck.</div>`;
    }
    h += `<div class="stat-grid">`;
    for (const [cat, base] of Object.entries(BASELINE)) {
      const want = Math.round(base * scale);
      const have = counts[cat];
      const cls = have >= want ? "ok" : (have >= want * 0.6 ? "high" : "low");
      h += `<div class="stat"><div>${cat}</div><b class="${cls}">${have}</b>
            <span class="target">/ ~${want} target${scale < 1 ? " (scaled)" : ""}</span></div>`;
    }
    h += `<div class="stat"><div>Other functional roles</div><b>${counts.Other}</b></div></div>`;
    h += `<details class="breakdown"><summary>Deck breakdown — show classified cards</summary>`;
    h += `<div class="hint">Functional categories — “Other” means the card is not basic ramp/draw/removal; it may still be core theme evidence below.</div>`;
    for (const category of [...Object.keys(BASELINE), "Other"]) {
      const cards = classified[category];
      h += `<details><summary>${category} (${counts[category]})</summary>
            <div class="card-list">${cards.length ? cards.map(c =>
              cardLink(c.name, c.qty > 1 ? `${c.qty}× ${c.name}` : c.name)).join(" · ") : "None"}</div></details>`;
    }
    h += `<div id="themeBreakdown"></div></details>`;
    if (scale < 1) h += `<div class="hint">Targets scaled to your ${total}-card pile; a full deck wants ~${BASELINE.Lands} lands, ${BASELINE.Ramp} ramp, ${BASELINE["Card draw"]} draw, ${BASELINE.Interaction} interaction.</div>`;
    $("health").innerHTML = h;

    // Themes — the pile's own mechanics, then suggestions keyed to them
    status("Detecting themes…");
    const tax = await loadThemes();
    const cardObjs = entries.map(e => found.get(front(e.name).toLowerCase()))
                            .filter(Boolean);
    const goalText = $("goal").value.trim();
    const forced = [...document.querySelectorAll("#themeChecks input:checked")]
      .map(cb => cb.value);
    const tagIndex = await loadThemeTags();
    const { ranked: themesRanked, tribal } =
      detectThemesJs(cardObjs, tax, cmdrCard, goalText, forced, tagIndex);
    const jobs = themesRanked.map(([t, m, cm, gl]) =>
      [t, m, [...(tax.themes[t].oracle_tags || []).map(tag => `otag:${tag}`),
              ...tax.themes[t].payoffs], cm, gl]);
    if (tribal) {
      jobs.push([`${tribal[0]} tribal`, tribal[1],
                 tax.tribal.payoffs.map(q => q.split("{TYPE}").join(tribal[0])),
                 false, false]);
    }
    if (jobs.length) {
      let breakdown = `<div class="hint" style="margin-top:10px">Theme matches</div>`;
      for (const [theme, matched, , cmdrHit] of jobs) {
        const evidence = [...matched];
        if (cmdrHit && cmdrCard && !evidence.some(n => front(n).toLowerCase() === front(cmdrCard.name).toLowerCase())) {
          evidence.unshift(cmdrCard.name);
        }
        breakdown += `<details><summary>${esc(theme)} (${evidence.length})</summary>
          <div class="card-list">${evidence.length ? evidence.map(name => {
            const commanderMatch = cmdrCard && front(name).toLowerCase() === front(cmdrCard.name).toLowerCase();
            return cardLink(name, name + (commanderMatch ? " (commander)" : ""));
          }).join(" · ") : "Goal selected; no matching cards currently in the deck."}</div></details>`;
      }
      $("themeBreakdown").innerHTML = breakdown;
    }
    let th = `<h2>Themes in this pile — suggestions that fit what it's doing</h2>`;
    if (!themesRanked.length && !tribal) {
      th += `<div class="hint">No dominant theme yet (needs ${tax.min_cards}+ cards pulling the same direction) — the finishers below are generic to your colors.</div>`;
      $("themes").innerHTML = th;
    } else {
      $("themes").innerHTML = th;
      // Theme pairs get intersection suggestions first — cards that serve
      // BOTH mechanics beat cards that serve one.
      const active = new Set(themesRanked.map(([t]) => t));
      const allThemeSuggestions = [];
      for (const [pair, spec] of Object.entries(tax.intersections || {})) {
        const [a, b] = pair.split("|");
        if (!active.has(a) || !active.has(b)) continue;
        status(`Theme combo: ${spec.label}…`);
        const sugg = await themeSuggestions(spec.payoffs, ident, maxPrice, deckSet,
                                             tax, tax.max_theme_suggestions || 8);
        allThemeSuggestions.push(...sugg);
        th += `<div class="pill-row"><b>${esc(spec.label)}</b>
               <span class="pill">both themes present</span></div>`;
        th += sugg.map(finisherCardHtml).join("");
        $("themes").innerHTML = th;
      }
      for (const [theme, matched, queries, cmdrHit, isGoal] of jobs) {
        status(`Theme payoffs: ${theme}…`);
        const sugg = await themeSuggestions(queries, ident, maxPrice, deckSet,
                                             tax, tax.max_theme_suggestions || 8);
        allThemeSuggestions.push(...sugg);
        const tags = (isGoal ? '<span class="tag ends">your goal</span>' : "")
          + (cmdrHit ? '<span class="tag finite">commander theme</span>' : "");
        th += `<div class="pill-row"><b>${esc(theme)}</b>${tags}
               <span class="pill">${matched.length ? matched.length + (cmdrHit && !matched.some(n => cmdrCard && front(n).toLowerCase() === front(cmdrCard.name).toLowerCase()) ? " + commander" : "") + " matching cards" : "building toward it"}</span></div>`;
        th += sugg.length ? sugg.map(finisherCardHtml).join("")
                          : `<div class="hint">nothing new in identity/budget</div>`;
        $("themes").innerHTML = th;
      }
      const cuts = cutCandidatesWeb(cardObjs, allThemeSuggestions, active, tribal,
                                    cmdrCard, counts, scale, tax, tagIndex);
      th += `<h2>Potential cuts to review</h2><div class="hint">This is a review aid. Theme suggestions above are additions to compare separately, not one-for-one replacements.</div>`;
      th += cuts.length ? cuts.map(cut => `<div class="finisher"><div class="name">${cardLink(cut.card.name)}</div>
        <div class="text">Why: ${esc(cut.reasons.join("; "))}.</div></div>`).join("")
        : `<div class="hint">No low-confidence cuts found without weakening a protected role.</div>`;
      $("themes").innerHTML = th;
    }

    // EDHREC synergy — cards overrepresented for THIS commander
    if (cmdrCard) {
      status("Checking EDHREC synergy…");
      const syn = await edhrecSynergy(cmdrCard.name, deckSet);
      if (syn) {
        let sh = `<h2>EDHREC synergy picks for ${esc(cmdrCard.name)}</h2>
                  <div class="hint">"Synergy" = how much more often the card shows up in this commander's decks than in other decks of these colors — the opposite of a generic staple. You already run ${syn.owned} of the ${syn.total} top synergy/top cards.</div>`;
        for (const cv of syn.fresh) {
          const pct = cv.synergy != null
            ? ` <span class="pill">${cv.synergy >= 0 ? "+" : ""}${Math.round(cv.synergy * 100)}% synergy</span>` : "";
          sh += `<div class="combo"><a href="https://edhrec.com${cv.url || ""}" target="_blank">${esc(cv.name)}</a>${pct}</div>`;
        }
        if (!syn.fresh.length) sh += `<div class="hint">Nothing to add — your list already covers EDHREC's synergy picks.</div>`;
        $("synergy").innerHTML = sh;
      } else {
        $("synergy").innerHTML = "";
      }
    } else {
      $("synergy").innerHTML = "";
    }

    // Combos
    const db = await loadComboDb(status);
    status("Matching combos…");
    const { included, almost } = matchCombos(db, deckSet,
                                             cmdrCard ? cmdrCard.name : null, ident);

    const incShow = included.filter(c => showInf || !c.infinite);
    const incHidden = included.length - incShow.length;
    $("combos").innerHTML = `<h2>Combos already in the pile (${included.length})</h2>`
      + (incShow.map(comboHtml).join("") || "")
      + (incHidden ? `<div class="hint">${incHidden} infinite combo(s) hidden — tick "show infinite" to list them (useful for finding cuts).</div>` : "")
      + (!included.length ? `<div class="hint">None yet — see below for what one card could unlock.</div>` : "");

    const byCard = new Map();
    for (const c of almost) {
      const k = c.missing[0];
      if (!byCard.has(k)) byCard.set(k, []);
      byCard.get(k).push(c);
    }
    const ranked = [...byCard.entries()].map(([card, combos]) => {
      const finite = combos.filter(c => !c.infinite);
      const ends = finite.filter(c => c.ends);
      const prices = combos.map(c => c.price).filter(p => p != null);
      return { card, combos, finite, ends, price: prices.length ? Math.min(...prices) : null };
    }).filter(r => (showInf || r.finite.length) && (r.price == null || r.price <= maxPrice))
      .sort((a, b) => b.ends.length - a.ends.length || b.finite.length - a.finite.length
                      || Math.max(...b.combos.map(c => c.popularity)) - Math.max(...a.combos.map(c => c.popularity)));

    let ah = `<h2>One card away (${ranked.length} candidates under $${maxPrice})</h2>`;
    for (const r of ranked.slice(0, 12)) {
      ah += `<div class="addcard">+ ${esc(r.card)} <span class="price">${r.price != null ? "~$" + r.price.toFixed(2) + " combo" : ""}</span>
             — ${r.finite.length} finite (${r.ends.length} game-ending), ${r.combos.length - r.finite.length} infinite</div>`;
      ah += (showInf ? r.combos : r.finite).slice(0, 3).map(comboHtml).join("");
    }
    if (ranked.length > 12) ah += `<div class="hint">…and ${ranked.length - 12} more.</div>`;
    if (!ranked.length) ah += `<div class="hint">No finite near-miss combos in budget — check the finishers below instead; that's usually the better path anyway.</div>`;
    $("almost").innerHTML = ah;

    // Finishers
    let fh = `<h2>Finite finishers to close games (identity ${ident}, under $${maxPrice}, EDHREC-ranked)</h2>`;
    $("finishers").innerHTML = fh;
    for (const [bucket, q] of Object.entries(FINISHER_BUCKETS)) {
      status(`Searching finishers: ${bucket}…`);
      const cards = await scryfallSearch(`(${q}) id<=${ident} legal:commander usd<=${maxPrice}`);
      const fresh = cards.filter(c => !deckSet.has(front(c.name).toLowerCase()))
        .sort((a, b) => impactForCard(b, tax).score - impactForCard(a, tax).score)
        .slice(0, 6);
      fh += `<div class="pill-row"><b>${bucket}</b></div>`;
      if (!fresh.length) fh += `<div class="hint">nothing new in identity/budget</div>`;
      for (const c of fresh) {
        const text = oracleOf(c).split("\n").find(l => GAME_ENDING.test(l) || /win the game/i.test(l))
                     || oracleOf(c).split("\n")[0] || "";
        const price = c.prices && c.prices.usd ? ` · $${c.prices.usd}` : "";
        const impact = impactForCard(c, tax);
        const impactText = impact.score
          ? `<br>Multiplayer impact: ${esc(impact.scope)}; ${esc(impact.delivery)}` : "";
        fh += `<div class="finisher"><div class="name"><a href="${c.scryfall_uri}" target="_blank">${esc(c.name)}</a><br>
               <span class="text">${esc(c.mana_cost || "")}${price}</span></div>
               <div class="text">${esc(text.slice(0, 220))}${impactText}</div></div>`;
      }
      $("finishers").innerHTML = fh;
      await sleep(120);
    }
    status("");
    $("results").style.display = "";
  } catch (e) {
    status("Error: " + e.message);
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}
$("go").addEventListener("click", analyze);

// Theme picker checkboxes, straight from the taxonomy.

    `<label style="display:inline-block;margin:3px 12px 3px 0">
       <input type="checkbox" value="${esc(t)}"> ${esc(t)}</label>`).join("");
}).catch(() => { /* picker is optional; analyze still loads themes itself */ });
